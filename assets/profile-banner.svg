<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Mia profile banner</title>
  <desc id="desc">A minimal animated GitHub profile banner for Mia.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8b8c8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7f93a8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a8b8c8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a4b5c7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a4b5c7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ccd7e2" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      .title { font: 600 52px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; letter-spacing: 0.06em; fill: #2d3948; }
      .subtitle { font: 400 20px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; letter-spacing: 0.02em; fill: #6d8093; }
    </style>
  </defs>

  <rect width="900" height="260" rx="20" fill="url(#bg)"/>
  <rect width="900" height="260" rx="20" fill="url(#grid)" opacity="0.7"/>

  <g filter="url(#blur)">
    <circle cx="155" cy="82" r="44" fill="url(#glow)">
      <animate attributeName="cx" values="155;170;155" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="82;94;82" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="738" cy="186" r="58" fill="url(#glow)">
      <animate attributeName="cx" values="738;720;738" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="186;170;186" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(155 130)">
    <circle r="82" fill="none" stroke="#d5dee8" stroke-width="1"/>
    <circle r="56" fill="none" stroke="#c5d0db" stroke-width="1.2" stroke-dasharray="2 7"/>
    <circle r="28" fill="none" stroke="#dbe3eb" stroke-width="1"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <circle cx="0" cy="-56" r="5" fill="#8196ab"/>
      <circle cx="0" cy="56" r="3.5" fill="#b0becd"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <circle cx="82" cy="0" r="4.5" fill="#91a5b8"/>
      <circle cx="-82" cy="0" r="3" fill="#c6d2dd"/>
    </g>

    <circle r="2.5" fill="#5f7388"/>
  </g>

  <g transform="translate(625 58)">
    <path d="M0 34 C38 18 66 18 102 34 S168 50 204 34" fill="none" stroke="url(#line)" stroke-width="2.1" stroke-linecap="round">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0 34 C38 18 66 18 102 34 S168 50 204 34;
                M0 34 C38 50 66 50 102 34 S168 18 204 34;
                M0 34 C38 18 66 18 102 34 S168 50 204 34"/>
    </path>
    <path d="M18 72 C54 56 84 56 120 72 S186 88 222 72" fill="none" stroke="url(#line)" stroke-width="1.8" stroke-linecap="round" opacity="0.88">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M18 72 C54 56 84 56 120 72 S186 88 222 72;
                M18 72 C54 88 84 88 120 72 S186 56 222 72;
                M18 72 C54 56 84 56 120 72 S186 88 222 72"/>
    </path>
    <path d="M0 110 C34 96 72 96 108 110 S174 124 210 110" fill="none" stroke="url(#line)" stroke-width="1.5" stroke-linecap="round" opacity="0.72">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M0 110 C34 96 72 96 108 110 S174 124 210 110;
                M0 110 C34 124 72 124 108 110 S174 96 210 110;
                M0 110 C34 96 72 96 108 110 S174 124 210 110"/>
    </path>

    <circle cx="204" cy="34" r="3.4" fill="#7f94a9">
      <animate attributeName="cx" values="0;204;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="222" cy="72" r="3" fill="#a2b2c2">
      <animate attributeName="cx" values="222;18;222" dur="7.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="110" r="2.8" fill="#c0ccd8">
      <animate attributeName="cx" values="0;210;0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(450 130)">
    <text x="0" y="-8" text-anchor="middle" class="title">Mia</text>
    <text x="0" y="34" text-anchor="middle" class="subtitle">Keep learning and exploring</text>
    <rect x="128" y="17" width="2.2" height="20" rx="1.1" fill="#8fa4b9">
      <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
