<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Mia — Quiet Signal</title>
  <desc id="desc">A minimal animated profile banner with subtle signal lines, drifting nodes and AI engineering themes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91a6bb" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#718aa3" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#718aa3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#91a6bb" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8fa9c3" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8fa9c3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#9aaabd" stroke-width="0.55" opacity="0.18"/>
    </pattern>
    <style>
      .canvas { fill: url(#bg); }
      .grid-overlay { fill: url(#grid); opacity: .5; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; letter-spacing: 0.18em; fill: #718096; }
      .title { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 650; letter-spacing: 0.18em; fill: #263544; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #68798a; }
      .line { stroke: #7890a7; }
      .node { fill: #7890a7; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d141c; }
        .grid-overlay { opacity: .16; }
        .label { fill: #8097aa; }
        .title { fill: #dbe6ef; }
        .sub { fill: #99adbe; }
        .line { stroke: #6f879e; }
        .node { fill: #91a9bf; }
      }
    </style>
  </defs>

  <rect width="900" height="260" rx="22" class="canvas"/>
  <rect width="900" height="260" rx="22" class="grid-overlay"/>

  <circle cx="165" cy="75" r="72" fill="url(#glow)" filter="url(#soft)" opacity="0.55">
    <animate attributeName="cx" values="150;185;150" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="76;58;76" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="188" r="82" fill="url(#glow)" filter="url(#soft)" opacity="0.42">
    <animate attributeName="cx" values="748;715;748" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="188;205;188" dur="13s" repeatCount="indefinite"/>
  </circle>

  <line x1="92" y1="130" x2="808" y2="130" stroke="url(#signal)" stroke-width="1" opacity="0.9"/>
  <line x1="450" y1="34" x2="450" y2="226" class="line" stroke-width="0.8" opacity="0.16" stroke-dasharray="3 8"/>

  <g fill="none" class="line" opacity="0.45">
    <circle cx="135" cy="130" r="48" stroke-width="0.8" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0 135 130" to="360 135 130" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="135" cy="130" r="26" stroke-width="0.7" opacity="0.55"/>
  </g>
  <circle cx="183" cy="130" r="3.1" class="node">
    <animateTransform attributeName="transform" type="rotate" from="0 135 130" to="360 135 130" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="104" r="2.4" class="node" opacity="0.72">
    <animateTransform attributeName="transform" type="rotate" from="360 135 130" to="0 135 130" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="130" r="4" class="node" opacity="0.9">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" class="line" stroke-width="1" stroke-linecap="round" opacity="0.36">
    <path d="M700 102 C730 102 730 80 760 80 S790 102 820 102" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M690 130 C725 130 725 145 760 145 S795 130 830 130" stroke-dasharray="2 9">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M705 158 C735 158 735 178 765 178 S795 158 825 158" stroke-dasharray="5 10">
      <animate attributeName="stroke-dashoffset" values="30;0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g class="node">
    <circle cx="760" cy="80" r="2.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="145" r="2.7"><animate attributeName="opacity" values="1;0.3;1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="765" cy="178" r="2.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="82" text-anchor="middle" class="label" font-size="11">ZMR-OVO / SHANGHAI</text>
  <text x="450" y="129" text-anchor="middle" class="title" font-size="34">MIA</text>
  <text x="450" y="158" text-anchor="middle" class="sub" font-size="12">AI AGENT · LLM SYSTEMS · NEURAL REPRESENTATION</text>

  <g class="sub" font-size="11" opacity="0.74">
    <text x="450" y="193" text-anchor="middle">&gt; building reliable intelligent systems</text>
    <rect x="596" y="184" width="7" height="12" rx="1" fill="#7890a7">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="label" font-size="8.5" opacity="0.62">
    <text x="30" y="34">SIGNAL / 01</text>
    <text x="870" y="34" text-anchor="end">QUIETLY BUILDING</text>
    <text x="30" y="235">AGENT → RAG → LLM</text>
    <text x="870" y="235" text-anchor="end">RESEARCH / ENGINEERING</text>
  </g>

  <rect x="1" y="1" width="898" height="258" rx="21" fill="none" class="line" stroke-width="1" opacity="0.18"/>
</svg>
